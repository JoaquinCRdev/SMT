
services:
  server:
    build:
      context: ./server
      target: development
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGIN: http://100.x.y.z:5173
      CLIENT_URL: http://100.x.y.z:5173
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: development
    environment:
      VITE_API_URL: http://100.x.y.z:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_node_modules:
  client_node_modules:
