services:
  server:
    build:
      context: ./server
      target: production
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:?Defini VITE_API_URL en el archivo pasado mediante --env-file}
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
